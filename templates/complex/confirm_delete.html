{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header"><h1 class="page-title">{{ title }}</h1></div>
<div class="form-card text-center">
  <i class="bi bi-trash text-danger fs-1 mb-3 d-block"></i>
  <p class="text-muted">{{ warning }}</p>
  <form method="post" class="d-flex gap-2 justify-content-center mt-4">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger px-4">Удалить</button>
    <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
